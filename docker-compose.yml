services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: xecurity
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xecurity_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://xecurity:password@db:5432/xecurity_platform
      - LICENSE_PRIVATE_KEY_PATH=/app/keys/dev_private.pem
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:

# Render deployment configuration for Xecurity Platform Backend
# https://docs.render.com/blueprint-spec

services:
  - type: web
    name: xecurity-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PATH
        value: uploads
      - key: PYTHON_VERSION
        value: "3.12"
